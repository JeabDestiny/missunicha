<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff0f6">
<title>our little memories ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{min-height:100%;background:#fff0f6}
body{margin:0;min-height:100vh;padding:0 10px 28px;background:#fff0f6;color:#80546a;font-family:Kanit,sans-serif;font-weight:300;text-align:center}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(#fff 1.5px,transparent 1.5px);background-size:28px 28px}
main{position:relative;max-width:520px;margin:0 auto}
.topline{height:2px;background:#f8d8e5;margin:0 -10px 0}
.mark{font-family:Itim,cursive;font-size:34px;line-height:1.2;color:#8b5e73;margin:0 0 8px}
.subtitle{font-size:16px;line-height:1.7;margin:0 auto 29px;padding:0 8px;color:#80546a}
.card{background:#fff;border-radius:25px;padding:10px 10px 17px;box-shadow:0 10px 30px rgba(190,116,150,.08)}
img{display:block;width:min(100%,420px);height:auto;margin:0 auto;object-fit:contain}
.caption{font-family:Itim,cursive;color:#c16d91;font-size:14px;margin:11px 0 0}
@media(min-width:600px){main{max-width:560px}.subtitle{margin-bottom:30px}.card{padding:11px 11px 18px}}
</style>
</head>
<body>
<div class="topline"></div>
<main>
  <div class="mark">୨୧</div>
  <p class="subtitle">รูปเดียวที่เก็บความทรงจำหลายช่วงเวลาของเราไว้ด้วยกัน</p>
  <section class="card">
    <img src="our-memory.jpg" alt="ภาพรวมความทรงจำของเราสองคน">
    <p class="caption">our little memories · ☰</p>
  </section>
</main>
</body>
</html>
